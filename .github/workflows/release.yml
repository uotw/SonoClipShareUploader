name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed by the release job to create/update a GitHub Release

jobs:
  mac:
    runs-on: macos-latest
    # Copy node_modules into the app instead of hardlinking — otherwise the x64
    # ffmpeg swap below would mutate files already sealed inside the signed
    # arm64 bundle and break its code signature ("sealed resource is invalid").
    env:
      USE_HARD_LINKS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # ffprobe-static ships an x86_64 binary in its darwin/arm64 slot, so the
      # arm64 app would bundle an Intel component (macOS Rosetta-deprecation
      # warning). Swap in the genuine arm64 ffprobe before the arm64 build so it
      # gets signed + notarized like everything else.
      - name: Use a genuine arm64 ffprobe
        run: |
          npm install --no-save @ffprobe-installer/darwin-arm64
          cp node_modules/@ffprobe-installer/darwin-arm64/ffprobe \
             node_modules/ffprobe-static/bin/darwin/arm64/ffprobe
          chmod +x node_modules/ffprobe-static/bin/darwin/arm64/ffprobe
          a=$(lipo -archs node_modules/ffprobe-static/bin/darwin/arm64/ffprobe)
          echo "arm64 ffprobe arch: $a"
          [ "$a" = "arm64" ] || { echo "::error::arm64 ffprobe is not arm64 ($a)"; exit 1; }

      # ffmpeg-static ships a single binary for the host arch (arm64 on the
      # macos-latest runner). ffprobe-static bundles every platform, so only
      # ffmpeg needs swapping between the two mac builds.
      - name: Build & sign arm64
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: npm run dist-macarm -- --publish never

      # THE UPDATER FEED, NOT JUST THE INSTALLERS -- AND STASHED RIGHT HERE.
      #
      # electron-updater reads latest-mac.yml from the Release and downloads the
      # .zip; Squirrel.Mac cannot update from a .dmg, so publishing only the
      # DMGs means the app never sees an update at all.
      #
      # Each electron-builder run REWRITES dist/latest-mac.yml, so this copy has
      # to happen between the two mac builds. Doing it after both (where it was
      # in v2.7.0) stashes the x64 feed under the arm64 name, and the merge below
      # then produces a feed with four x64 entries and no arm64 at all -- which
      # offers Apple Silicon users the Intel build.
      - name: Stash the arm64 updater feed
        run: cp dist/latest-mac.yml dist/latest-mac-arm64.yml

      - name: Swap in x64 ffmpeg binary
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js

      - name: Build & sign x64
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: npm run dist-mac64 -- --publish never

      # Fail immediately if signing was silently skipped (e.g. bad cert secret),
      # instead of wasting a notarization round-trip on an unsigned app.
      - name: Verify Developer ID signing
        run: |
          for app in "dist/mac-arm64/"*.app "dist/mac/"*.app; do
            echo "Checking: $app"
            codesign -dvv "$app" 2>&1 | grep -q "Authority=Developer ID Application" \
              || { echo "::error::$app is NOT Developer ID signed (check MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD)"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$app" \
              || { echo "::error::signature verification failed for $app"; exit 1; }
            echo "✓ signed: $app"
          done

      - name: Notarize & staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for dmg in dist/*.dmg; do
            echo "::group::Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmgs
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac*.yml
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # package.json pins electron-builder v24 (v26 can't package the Mac app's
      # frameworks for this Electron version). Native azureSignOptions needs
      # v25+, and the Mac-only bug doesn't affect Windows packaging.
      - name: Use electron-builder v26 (Windows only)
        run: npm install --no-save electron-builder@26.8.1

      - name: Build & sign (x64)
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run dist-win64 -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

  release:
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # ONE latest-mac.yml LISTING BOTH ARCHITECTURES.
      #
      # The two mac builds each produced their own, and electron-updater picks
      # the entry matching the running machine -- so publishing only one of them
      # would offer Intel builds to Apple Silicon users, or nothing at all. This
      # takes the x64 feed as the base and appends the arm64 file entry.
      - name: Merge the mac updater feeds
        run: |
          python3 - <<'EOF'
          import glob, io, sys
          arm = glob.glob('artifacts/**/latest-mac-arm64.yml', recursive=True)
          x64 = [f for f in glob.glob('artifacts/**/latest-mac.yml', recursive=True)]
          if not arm or not x64:
              sys.exit('missing mac updater feed: arm=%s x64=%s' % (arm, x64))
          base = open(x64[0]).read()
          armtxt = open(arm[0]).read()
          # pull the arm64 `files:` entry (url/sha512/size) out of its feed
          lines = armtxt.splitlines()
          start = next(i for i, l in enumerate(lines) if l.startswith('files:'))
          entry = []
          for l in lines[start+1:]:
              if l and not l.startswith((' ', '-', '\t')):
                  break
              entry.append(l)
          out = []
          for l in base.splitlines():
              out.append(l)
              if l.startswith('files:'):
                  out.extend(entry)
          merged = '\n'.join(out) + '\n'
          open(x64[0], 'w').write(merged)
          print(merged)

          # ASSERT WHAT WE BUILT. v2.7.0 shipped a feed with four x64 entries and
          # no arm64 -- valid YAML, published without complaint, and wrong. A
          # broken feed is invisible until someone's update offers them the other
          # architecture, so it is checked here rather than discovered later.
          zips = [l for l in merged.splitlines() if l.strip().startswith('- url:') and l.endswith('.zip')]
          arm = [l for l in zips if 'arm64' in l]
          intel = [l for l in zips if 'arm64' not in l]
          if len(arm) != 1 or len(intel) != 1:
              sys.exit('merged feed must list exactly one arm64 zip and one x64 zip; got:\n' +
                       '\n'.join(zips))
          print('feed lists one arm64 zip and one x64 zip -- ok')
          EOF

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/latest-mac.yml
            artifacts/**/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Tell sonoclipshare.com the newest version so the Auth0 login page can
      # show the "update available" banner (server/appversion.php). Best-effort:
      # a failure here must not fail the release.
      # THE ANNOUNCEMENT, gated separately from the release itself.
      #
      # appversion.php is what makes existing installs show "a new version is
      # available"; electron-updater does not consult it at all, it reads the
      # Release feed directly. Keeping them separate means a release can be
      # published and updated-to WITHOUT being announced -- which is how a
      # release gets verified end to end before anyone is told about it.
      #
      # Set the repository variable ANNOUNCE_RELEASE to "true" (Settings ->
      # Secrets and variables -> Actions -> Variables) when a release should be
      # advertised. Left unset, tags publish silently. To announce afterwards,
      # either flip it and re-run this job, or POST by hand:
      #   curl -X POST "https://www.sonoclipshare.com/appversion.php?version=2.7.0" \
      #        -H "X-Release-Token: <token>"
      - name: Publish latest version to sonoclipshare.com
        if: vars.ANNOUNCE_RELEASE == 'true'
        env:
          SCS_RELEASE_TOKEN: ${{ secrets.SCS_RELEASE_TOKEN }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          curl -fsS -X POST "https://www.sonoclipshare.com/appversion.php?version=${V}" \
            -H "X-Release-Token: ${SCS_RELEASE_TOKEN}" \
            || echo "::warning::version publish to sonoclipshare.com failed (non-fatal)"
